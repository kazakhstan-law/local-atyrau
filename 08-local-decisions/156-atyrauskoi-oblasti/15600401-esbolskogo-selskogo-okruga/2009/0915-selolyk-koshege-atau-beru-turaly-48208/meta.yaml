requisite: Атырау облысы Махамбет ауданы Есбол селолық округі әкімінің 2009 жылғы 15 қыркүйектегі № 18 шешімі. Атырау облысы Әділет департаменті Махамбет ауданының Әділет басқармасында 2009 жылғы 20 қазанда № 4-3-129 тіркелді. Күші жойылды - Махамбет ауданы әкімінің 2010 жылғы 27 қазандағы № 33 шешімімен
