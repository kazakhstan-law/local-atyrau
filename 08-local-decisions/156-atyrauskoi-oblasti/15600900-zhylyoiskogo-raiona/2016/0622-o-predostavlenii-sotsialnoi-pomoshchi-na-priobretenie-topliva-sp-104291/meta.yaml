requisite: Решение маслихата Жылыойского района Атырауской области от 22 июня 2016 года № 3-12. Зарегистрировано Департаментом юстиции Атырауской области 8 июля 2016 года № 3551. Утратило силу решением Жылыойского районного маслихата Атырауской области от 30 января 2018 года № 17-3
title:
  rus: О предоставлении социальной помощи на приобретение топлива специалистам государственных организаций социального обеспечения, образования, культуры, спорта   и ветеринарии, проживающим и работающим  в сельских населенных пунктах Жылыойского района
  kaz: Жылыой ауданының ауылдық елді мекендерінде  тұратын және жұмыс істейтін мемлекеттік әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына отын сатып алу үшін әлеуметтік көмек беру туралы
