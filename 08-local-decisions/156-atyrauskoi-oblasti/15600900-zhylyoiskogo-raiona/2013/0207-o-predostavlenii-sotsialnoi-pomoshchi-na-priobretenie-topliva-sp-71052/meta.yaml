requisite: Решение Жылыойского районного маслихата Атырауской области от 7 февраля 2013 года № 10-4. Зарегистрировано Департаментом юстиции Атырауской области 19 февраля 2013 года № 2688. Утратило силу - решением Жылыойского районного маслихата Атырауской области от 14 июня 2013 года № 13-8
title:
  rus: О предоставлении социальной помощи на приобретение топлива специалистам  государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Жылыойского района Атырауской области
  kaz: Атырау облысы Жылыой ауданының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына отын сатып алу үшін әлеуметтік көмек беру туралы
