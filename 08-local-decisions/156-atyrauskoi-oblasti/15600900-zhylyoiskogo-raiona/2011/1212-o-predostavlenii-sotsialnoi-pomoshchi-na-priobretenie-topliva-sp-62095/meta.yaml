title:
  rus: О предоставлении социальной помощи на приобретение топлива специалистам  государственных организаций здравоохранения, социального обеспечения,  образования, культуры и спорта, проживающим и работающим в сельских населенных пунктах Жылыойского района Атырауской области
  kaz: Атырау облысы Жылыой ауданы бойынша ауылдық елді мекендерде тұратын және  жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет және спорт ұйымдарының мамандарына отын сатып алу үшін әлеуметтік көмек беру туралы
