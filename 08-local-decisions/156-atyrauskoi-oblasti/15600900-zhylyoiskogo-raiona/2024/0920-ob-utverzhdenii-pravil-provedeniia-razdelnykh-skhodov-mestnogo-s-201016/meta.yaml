act_code: '201016'
requisite: Решение Жылыойского районного маслихата Атырауской области от 20 сентября 2024 года № 23-5
title:
  rus: Об утверждении правил проведения раздельных сходов местного сообщества и определения количества представителей жителей города районного значения, поселка, сельского округа, села, микрорайона, улицы, многоквартирного жилого дома для участия в сходе местного сообщества на территории города Кульсары, сельских округов и поселка Жана Каратон Жылыойского района
  kaz: Жылыой ауданының Құлсары қаласы, ауылдық округтері және Жаңа Қаратон кенті аумағында жергілікті қоғамдастықтың бөлек жиындарын өткізу және жергілікті қоғамдастық жиынына қатысу үшін аудандық маңызы бар қала, кент, ауылдық округ, ауыл, шағын аудан, көше, көппәтерлі тұрғын үй тұрғындары өкілдерінің санын айқындау қағидасын бекіту туралы
