  title:
    rus: О внесении изменений в решение Жылыойского районного маслихата «Об установлении специалистам в области социального обеспечения, образования, культуры и спорта являющимся гражданскими служащими и работающим в сельской местности повышенные должностные оклады и тарифные ставки» от 9 июня 2020 года № 47-5
    kaz: «Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін әлеуметтік қамсыздандыру, білім беру, мәдениет және спорт саласындағы  мамандарға жоғарылатылған лауазымдық айлықақылар мен тарифтік мөлшерлемелер белгілеу туралы» Жылыой аудандық мәслихатының 2020 жылғы 9 маусымдағы № 47-5 шешіміне өзгерістер енгізу туралы
