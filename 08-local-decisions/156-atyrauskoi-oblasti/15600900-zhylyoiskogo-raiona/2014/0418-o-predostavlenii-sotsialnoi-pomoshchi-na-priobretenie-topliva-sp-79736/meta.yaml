requisite: Решение Жылыойского районного маслихата Атырауской области от 18 апреля 2014 года № 19-5. Зарегистрировано Департаментом юстиции Атырауской области 12 мая 2014 года № 2910. Утратило силу решением Жылыойского районного маслихата Атырауской области от 24 октября 2014 года № 24-2
title:
  rus: О предоставлении социальной помощи на приобретение топлива специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Жылыойского района Атырауской области
  kaz: Атырау облысы, Жылыой ауданының ауылдық елді мекендерде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына отын сатып алу үшін әлеуметтік көмек беру туралы
