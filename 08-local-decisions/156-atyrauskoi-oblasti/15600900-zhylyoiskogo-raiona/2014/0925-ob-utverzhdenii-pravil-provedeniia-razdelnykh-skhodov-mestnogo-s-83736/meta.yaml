  title:
    rus: О внесении изменений в решение Жылыойского районного маслихата «Об утверждении правил проведения раздельных сходов местного сообщества и определения количества представителей жителей  улицы, многоквартирного жилого дома для участия в сходе местного сообщества на территории города Кульсары» от 25 сентября 2014 года № 23-7
    kaz: «Құлсары қаласы аумағында бөлек жергілікті қоғамдастық жиындарын өткізу және жергілікті қоғамдастық жиынына қатысу үшін көше, көппәтерлі тұрғын үй тұрғындары өкілдерінің санын айқындау қағидасын бекіту туралы» Жылыой ауданы мәслихатының 2014 жылғы 25 қыркүйектегі № 23-7 шешіміне өзгерістер енгізу туралы
