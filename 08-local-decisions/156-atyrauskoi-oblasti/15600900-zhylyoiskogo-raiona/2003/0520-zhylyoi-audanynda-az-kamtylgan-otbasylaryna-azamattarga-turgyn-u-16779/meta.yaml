act_code: '16779'
requisite: Атырау облысы Жылыой аудандық мәслихаты ХХХ сессиясының 2003 жылғы 21 мамырдағы 30-4 шешімі. Атырау облыстық Әділет басқармасында 2003 жылғы 26 маусымда № 1530 тіркелді. Күші жойылды - Атырау облысы Жылыой аудандық мәслихатының 2007 жылғы 19 желтоқсандағы № 3-5 шешімімен
