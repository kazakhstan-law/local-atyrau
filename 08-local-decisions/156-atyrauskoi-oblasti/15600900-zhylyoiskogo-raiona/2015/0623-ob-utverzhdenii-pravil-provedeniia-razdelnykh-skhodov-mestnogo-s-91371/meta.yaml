  title:
    rus: О внесении изменений в решение районного маслихата от 23 июня 2015 года №30-2 «Об утверждении правил проведения раздельных сходов местного сообщества и определения количества представителей жителей села, улицы, многоквартирного жилого дома для участия в сходе местного сообщества на территории сельских округов и поселка Жана Каратон Жылыойского района»
    kaz: Аудандық мәслихаттың 2015 жылғы 23 маусымдағы №30-2 «Жылыой ауданының ауылдық округтерінің және Жаңа Қаратон кенті аумағында бөлек жергілікті қоғамдастық  жиындарын өткізу және жергілікті қоғамдастық жиынына қатысу үшін  ауыл, көше, көппәтерлі тұрғын үй тұрғындары өкілдерінің санын айқындау қағидасын бекіту туралы» шешіміне өзгерістер енгізу туралы
