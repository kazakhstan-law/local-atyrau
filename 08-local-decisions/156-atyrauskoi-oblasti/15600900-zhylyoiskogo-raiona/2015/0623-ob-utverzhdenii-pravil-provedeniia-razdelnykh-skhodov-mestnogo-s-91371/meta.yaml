act_code: '91371'
requisite: Решение маслихата Жылыойского района Атырауской области от 23 июня 2015 года № 30-2. Зарегистрировано Департаментом юстиции Атырауской области 02 июля 2015 года № 3238. Утратило силу решением Жылыойского районного маслихата Атырауской области от 20 декабря 2023 года № 10-6 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении правил проведения раздельных сходов местного сообщества и определения количества представителей жителей села, улицы, многоквартирного жилого дома для участия в сходе местного сообщества на территории  сельских округов  и  поселка  Жана Каратон Жылыойского района
  kaz: Жылыой ауданының ауылдық округтерінің және Жаңа Қаратон кенті аумағында жергілікті қоғамдастықтың бөлек жиындарын өткізу және жергілікті қоғамдастық жиынына қатысу үшін ауыл, көше, көппәтерлі тұрғын үй тұрғындары өкілдерінің санын айқындау қағидасын бекіту туралы
