    kaz: Жылыой аудандық мәслихатының 2015 жылғы 23 қарашадағы № 34-4 «Мүгедектер қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын айқындау тәртібі мен мөлшерін белгілеу туралы» шешіміне өзгерістер енгізу туралы
