act_code: '135304'
requisite: Решение Жылыойского районного маслихата Атырауской области от 25 сентября 2019 года № 38-3. Зарегистрировано Департаментом юстиции Атырауской области 14 октября 2019 года № 4506
title:
  rus: Об утверждении Правил и размера оказания социальной поддержки по оплате коммунальных услуг и приобретению топлива за счет бюджетных средств специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Жылыойского района
  kaz: Жылыой ауданының ауылдық елді мекендеріне тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына бюджет қаражаты есебінен коммуналдық көрсетілетін қызметтерге ақы төлеу және отын сатып алу бойынша әлеуметтік қолдау көрсету Қағидасы мен мөлшерін бекіту туралы
