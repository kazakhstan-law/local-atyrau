  title:
    rus: О внесении изменения в решение Жылыойского районного маслихата от 25 сентября 2019 года № 38-3 «Об утверждении Правил и размера оказания социальной поддержки по оплате коммунальных услуг и приобретению топлива специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Жылыойского района»
    kaz: Жылыой аудандық мәслихатының 2019 жылғы 25 қыркүйектегі № 38-3 «Жылыой ауданының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына коммуналдық көрсетілетін қызметтерге ақы төлеу және отын сатып алу бойынша әлеуметтік қолдау көрсету қағидасы мен мөлшерін бекіту туралы» шешіміне өзгеріс енгізу туралы
