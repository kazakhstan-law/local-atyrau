requisite: Атырау облысы Құрманғазы ауданы Нұржау селолық округі әкімінің 2009 жылғы 27 қазандағы № 17 шешімі. Атырау облысы Әділет департаменті Құрманғазы ауданының Әділет басқармасында 2009 жылғы 29 қазанда № 4-8-163 болып тіркелді. Күші жойылды - Атырау облысы Құрманғазы ауданы Нұржау селолық округі әкімінің 2010 жылғы 22 қазандағы № 77 шешімімен
