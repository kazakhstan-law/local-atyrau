act_code: '49300'
requisite: Атырау облысы Құрманғазы ауданы Мақаш ауылдық округі әкімінің 2009 жылғы 27 қазандағы № 29 шешімі. Атырау облысы Әділет департаменті Құрманғазы ауданының Әділет басқармасында 2009 жылғы 26 қарашада № 4-8-173 болып тіркелді. Күші жойылды - Атырау облысы Құрманғазы ауданы Мақаш селолық округі әкімінің 2010 жылғы 22 қазандағы № 77 шешімімен
title:
