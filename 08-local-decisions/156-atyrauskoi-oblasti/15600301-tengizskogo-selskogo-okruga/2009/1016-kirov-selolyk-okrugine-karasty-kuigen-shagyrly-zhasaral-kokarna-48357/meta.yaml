act_code: '48357'
requisite: Атырау облысы Құрманғазы ауданы Киров селолық округі әкімінің 2009 жылғы 16 қазандағы № 23 шешімі. Атырау облысы Әділет департаменті Құрманғазы ауданының Әділет басқармасында 2009 жылғы 28 қазанда № 4-8-157 болып тіркелді. Күші жойылды - Атырау облысы Құрманғазы ауданы Киров селолық округі әкімінің 2010 жылғы 22 қазандағы № 77 шешімімен
