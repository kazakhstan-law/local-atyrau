requisite: Екінші сайланған Мақат аудандық мәслихаты ХХVI сессиясының 2003 жылғы 20 маусымдағы № 194-II шешімі. Атырау облыстық Әділет басқармасында 2003 жылы 15 шілдеде № 1564 болып тіркелді. Күші жойылды - Мақат аудандық мәслихатының 2012 жылғы 10 сәуірдегі № 34-V шешімімен
