requisite: Решение Макатского районного маслихата Атырауской области от 30 января 2018 года № 152-VI. Зарегистрировано Департаментом юстиции Атырауской области 22 февраля 2018 года № 4063. Утратило силу решением Макатского районного маслихата Атырауской области от 28 сентября 2020 года № 402-VI (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
