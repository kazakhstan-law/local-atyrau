title:
  rus: О признании утратившим силу решения Макатского районного маслихата от 11 октября 2017 года № 129-VI «Об утверждении правил управления бесхозяйными отходами, признанными решением суда поступившими в коммунальную собственность на территории Макатского района»
  kaz: Мақат аудандық мәслихатының 2017 жылғы 11 қазандағы № 129-VI «Мақат ауданы аумағында сот шешімімен коммуналдық меншікке түскен болып танылған иесіз қалдықтарды басқару қағидаларын бекіту туралы» шешімінің күшін жою деп тану туралы
