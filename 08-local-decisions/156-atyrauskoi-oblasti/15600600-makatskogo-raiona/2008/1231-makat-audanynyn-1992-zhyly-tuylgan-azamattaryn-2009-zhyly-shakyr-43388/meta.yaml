requisite: Атырау облысы Мақат ауданы әкімінің 2008 жылғы 31 желтоқсандағы № 25 шешімі. Атырау облысының Әділет департаменті Мақат ауданының Әділет басқармасында 2009 жылғы 15 қаңтарда № 4-7-92 тіркелді. Күші жойылды - Мақат ауданы әкімінің 2009 жылғы 30 желтоқсандағы № 27 шешімімен
