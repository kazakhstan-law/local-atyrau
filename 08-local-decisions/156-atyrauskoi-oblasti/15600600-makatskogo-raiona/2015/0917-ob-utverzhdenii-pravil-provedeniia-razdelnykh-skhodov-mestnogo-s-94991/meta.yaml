act_code: '94991'
requisite: Решение маслихата Макатского района Атырауской области от 17 сентября 2015 года № 325-V. Зарегистрировано Департаментом юстиции Атырауской области 27 октября 2015 года № 3326. Утратило силу решением Макатского районного маслихата Атырауской области от 22 ноября 2023 года № 54-VІII (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении правил проведения раздельных сходов местного сообщества и определения количества представителей жителей села, улицы, многоквартирного  жилого дома для участия в сходе местного сообщества на территории населенных пунктов Макатского района
  kaz: Мақат ауданының ауылдық округтерінің аумағында жергілікті қоғамдастықтың бөлек жиындарын өткізу және жергілікті қоғамдастық жиынына қатысу үшін ауыл, көше, көппәтерлі тұрғын үй тұрғындары өкілдерінің санын айқындау қағидасын бекіту туралы
