title:
  rus: Об установлении специалистам в области социального обеспечения, образования, культуры и спорта, являющимся гражданскими служащими и работающим в сельской местности повышенных должностных окладов и тарифных ставок по Макатскому району
  kaz: Мақат ауданы бойынша азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін әлеуметтік қамсыздандыру, білім беру, мәдениет және спорт саласындағы мамандарға жоғарылатылған лауазымдық айлықақылар мен тарифтік мөлшерлемелер белгілеу туралы
