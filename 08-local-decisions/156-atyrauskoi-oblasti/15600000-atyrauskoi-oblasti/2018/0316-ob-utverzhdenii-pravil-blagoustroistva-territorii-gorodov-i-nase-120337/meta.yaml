  title:
    rus: О внесении изменений и дополнения в решение Атырауского областного маслихата от 16 марта 2018 года № 199-VІ «Об утверждении правил содержания и защиты зеленых насаждений, правил благоустройства территорий городов и населенных пунктов Атырауской области»
    kaz: Атырау облыстық мәслихатының 2018 жылғы 16 наурыздағы № 199-VІ «Атырау облысының қалалары мен елді мекендерінің аумақтарында жасыл екпелерді күтіп-ұстаудың және қорғаудың қағидаларын, абаттандырудың қағидаларын бекіту туралы» шешіміне өзгерістер мен толықтыру енгізу туралы
