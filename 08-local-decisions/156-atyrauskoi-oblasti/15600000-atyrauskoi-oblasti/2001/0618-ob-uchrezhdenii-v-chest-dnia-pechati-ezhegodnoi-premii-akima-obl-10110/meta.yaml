act_code: '10110'
requisite: Решение акима Атырауской области от 19 июня 2001 года № 227. Зарегистрировано Управлением юстиции Атырауской области 20 июля 2001 года за № 563. Утратило силу решением акима Атырауской области от 30 марта 2009 года № 15
title:
  rus: Об учреждении в честь "Дня печати" ежегодной премии акима области имени основоположника казахской журналистики, профессора Т.С.Амандосова за цикл публикации статей в средствах массовой информации области
  kaz: '"Баспасөз күнi" мерекесi құрметiне бұқаралық ақпарат құралдарында жарияланған үздік журналистiк мақалалар топтамасына қазақ журналистикасының негiзiн салушы, профессор Т.С.Амандосов атындағы облыс әкiмiнiң жыл сайынғы сыйлығын тағайындау туралы'
