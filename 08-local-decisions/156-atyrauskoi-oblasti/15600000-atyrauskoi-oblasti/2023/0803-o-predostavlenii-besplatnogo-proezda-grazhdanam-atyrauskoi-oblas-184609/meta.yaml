act_code: '184609'
requisite: Решение Атырауского областного маслихата от 3 августа 2023 года № 44-VIII. Зарегистрировано в Департаменте юстиции Атырауской области 3 августа 2023 года № 5068-06
title:
  rus: О предоставлении бесплатного проезда гражданам Атырауской области за пределы населенного пункта постоянного проживания для получения высокотехнологичных медицинских услуг в рамках гарантированного объема бесплатной медицинской помощи и (или) медицинской помощи в системе обязательного социального медицинского страхования
  kaz: Тегін медициналық көмектің кепілдік берілген көлемі шеңберінде жоғары технологиялық медициналық көрсетілетін қызметтерді және (немесе) міндетті әлеуметтік медициналық сақтандыру жүйесінде медициналық көмекті алу үшін Атырау облысының азаматтарына тұрақты тұратын елді мекеннен тысқары жерлерге тегін жол жүруді ұсыну туралы
