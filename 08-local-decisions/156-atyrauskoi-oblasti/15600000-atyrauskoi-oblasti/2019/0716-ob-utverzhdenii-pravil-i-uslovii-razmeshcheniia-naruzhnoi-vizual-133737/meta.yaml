act_code: '133737'
requisite: Решение Атырауского областного маслихата от 16 июля 2019 года № 345-VI. Зарегистрировано Департаментом юстиции Атырауской области 29 июля 2019 года № 4476
title:
  rus: Об утверждении Правил и условии размещения наружной (визуальной) рекламы на открытом пространстве за пределами помещений в населенных пунктах, в полосе отвода автомобильных дорог общего пользования, на открытом пространстве за пределами помещений вне населенных пунктов и вне полосы отвода автомобильных дорог общего пользования на территории Атырауской области
  kaz: Атырау облысы аумағында Сыртқы (көрнекі) жарнаманы елді мекендердегі үй-жайлардың шегінен тыс ашық кеңістікте, жалпыға ортақ пайдаланылатын автомобиль жолдарының бөлінген белдеуінде, елді мекендерден тыс жердегі үй-жайлардың шегінен тыс ашық кеңістікте және жалпыға ортақ пайдаланылатын автомобиль жолдарының бөлінген белдеуінен тыс жерде орналастыру қағидалары мен шарттарын бекіту туралы
