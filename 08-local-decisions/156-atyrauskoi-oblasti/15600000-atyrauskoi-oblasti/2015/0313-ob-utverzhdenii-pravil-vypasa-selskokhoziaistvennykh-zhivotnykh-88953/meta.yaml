  requisite: Решение Атырауского областного маслихата от 19 августа 2022 года № 177-VII
  title:
    rus: О внесении изменений в решение Атырауского областного маслихата от 13 марта 2015 года № 364-V «Об утверждении Правил содержания и выгула собак и кошек, Правил отлова и уничтожения бродячих собак и кошек, Правил выпаса сельскохозяйственных животных в населенных пунктах Атырауской области»
    kaz: Атырау облыстық мәслихатының 2015 жылғы 13 наурыздағы № 364-V «Атырау облысының елді мекендерінде иттер мен мысықтарды асырау және серуендету Қағидаларын, қаңғыбас иттер мен мысықтарды аулау және жою Қағидаларын, ауыл шаруашылығы жануарларын жаюдың Қағидаларын бекіту туралы» шешіміне өзгерістер енгізу туралы
