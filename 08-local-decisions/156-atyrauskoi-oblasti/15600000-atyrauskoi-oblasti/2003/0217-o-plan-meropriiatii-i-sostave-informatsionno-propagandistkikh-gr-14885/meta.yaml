title:
  rus: О план мероприятий и составе информационно-пропагандистких групп по разъяснению и пропаганде стратегии «Казахстан-2030», послания Президента страны народу Казахстана «Об основных направлениях внутренней и внешней политики на 2003 год» и Программы Правительства Республики Казахстан на 2002-2004 годы
  kaz: «Қазақстан -2030» стратегиясын Елбасының «Ішкі және сыртқы саясаттың 2003 жылғы арналған негізгі бағыттары туралы» Қазақстан халқына Жолдауын және Қазақстан Республикасы Үкіметінің 2002-2004 жылдарға арналған Бағдарламасын түсіндіріп, насихаттау жөніндегі іс-шаралар жоспары мен ақпараттық – насихаттық топтардың құрамы туралы
