act_code: '18569'
requisite: Атырау облыстық мәслихатының ІІІ сессиясының 2003 жылғы 12 желтоқсандағы № 37-ІІІ шешiмi. Атырау облысының Әділет департаментінде 2004 жылғы 21 қаңтарда № 1811 болып тіркелді. Мемлекеттік тіркелуге жатпайды - ҚР Атырау облысы Әділет департаментінің 2006 жылғы 18 қазан № 3-3333/06 хаты негізінде
title:
