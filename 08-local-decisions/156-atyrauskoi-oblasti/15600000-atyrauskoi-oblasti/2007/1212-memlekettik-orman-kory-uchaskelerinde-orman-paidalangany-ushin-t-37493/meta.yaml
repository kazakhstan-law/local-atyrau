requisite: Атырау облыстық мәслихатының 2007 жылғы 12 желтоқсандағы № 43-ІV шешімі. Атырау облыстық Әділет департаментінде 2008 жылғы 22 қаңтарда № 2511 тіркелді. Күші жойылды - Атырау облыстық Мәслихатының 2012 жылғы 28 наурыздағы № 30-V шешімімен
