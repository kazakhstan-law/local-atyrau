requisite: Решение акима Атырауской области от 24 июня 2002 года № 456. Зарегистрированo Управлением юстиции Атырауской области 9 июля 2002 года за № 1047
title:
  rus: О присуждении в честь «Дня печати» ежегодной премии акима области имени основоположника казахской журналистики, профессора Т.С. Амандосова за цикл публикаций в средствах массой информации области
  kaz: '"Баспасөз күні" мерекесі құрметіне бұқаралық ақпарат құралдарында жарияланған үздік журналистік мақалалар топтамасына қазақ журналистикасының негізін салушы, профессор Т.С. Амандосов атындағы облыс әкімінің жыл сайынғы сыйлығы беру туралы'
