requisite: Атырау облысы әкiмiнiң 2002 жылғы 31 мамырдағы № 437 шешiмі. Атырау облысының Әділет басқармасында 2002 жылғы 25 маусымда № 1016 тіркелді.  Күші жойылды - Атырау облысы әкімінің 2009 жылғы 30 наурыздағы № 15 шешімімен
