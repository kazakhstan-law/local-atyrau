title:
  rus: Утвердить решение акима области № 415 от 3 апреля 2000 года "Об оказании единовременной социальной помощи на бесплатное изготовление и ремонт зубных протезов (за исключением протезов из драгоценных металлов) многодетным матерям Атырауской области в 2000 году"
  kaz: Облыс әкімінің 2000 жылғы 3 сәуірдегі № 415 «Атырау облысында 2000 жылы көп балалы аналарға тіс протездерін (аса құнды металдардан жасалған протездерден басқа) тегін дайындау және жөндеу үшін біржолғы әлеуметтік көмек көрсету туралы» шешімі туралы
