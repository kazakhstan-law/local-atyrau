title:
  rus: О реализации Постановления Правительства Республики Казахстан от 26 февраля 2000 года № 303 «О плане мероприятий по исполнению поручений Президента Республики Казахстан, вытекающих из его выступления 10 ноября 1999 года на церемонии принесения присяги вновь назначенными членами Правительства»
  kaz: Қазақстан Республикасы Үкіметінің 2000 жылғы 26 ақпандағы № 303 «Қазақстан Республикасы Президентінің 1999 жылдың 10 қарашасында ел Үкіметінің жаңадан тағайындалған мүшелерінің ант беру рәсімінде сөйлеген сөзінен туындайтын тапсырмаларын орындау жөніндегі іс-шаралардың жоспары туралы» қаулысын жүзеге асыру туралы
