  title:
    rus: О внесении изменений в решение Атырауского областного маслихата от 15 марта 2021 года № 31-VII «Об определении системы мер социальной поддержки медицинских и фармацевтических работников, направленных для работы в сельскую местность и поселки, а также в города районного значения Атырауской области»
    kaz: Атырау облыстық мәслихатының 2021 жылғы 15 наурыздағы № 31-VII «Атырау облысының ауылдық жерге және кенттерге, аудандық маңызы бар қалаларға жұмысқа жіберілген медицина және фармацевтика қызметкерлерін әлеуметтік қолдау шараларының жүйесін айқындау туралы» шешіміне өзгерістер енгізу туралы
