act_code: '161792'
requisite: Решение Атырауского областного маслихата от 20 декабря 2021 года № 120-VII. Зарегистрировано в Министерстве юстиции Республики Казахстан 20 декабря 2021 года № 25821. Утратило силу решением Атырауского областного маслихата от 18 марта 2026 года № 227-VIII (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении размера платы за один кубический метр поданной питьевой воды населению из особо важных групповых и локальных систем водоснабжения, являющихся безальтернативными источниками питьевого водоснабжения по Атырауской области
  kaz: Атырау облысы бойынша ауызсумен жабдықтаудың баламасыз көздері болып табылатын сумен жабдықтаудың ерекше маңызды топтық және оқшау жүйелерінен халыққа берілген ауызсудың бір текше метрі үшін төлемақы мөлшерін бекіту туралы
