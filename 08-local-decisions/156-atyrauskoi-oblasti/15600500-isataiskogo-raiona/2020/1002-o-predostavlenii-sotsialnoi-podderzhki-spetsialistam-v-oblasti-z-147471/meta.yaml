act_code: '147471'
requisite: Решение Исатайского районного маслихата Атырауской области от 2 октября 2020 года № 334-VI. Зарегистрировано Департаментом юстиции Атырауской области 15 октября 2020 года № 4769
title:
  rus: О предоставлении социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, поселков, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Исатайского района на 2020 год
  kaz: 2020 жылға арналған Исатай ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және  агроөнеркәсіптік кешен саласындағы мамандарына, ауылдар, кенттер, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне әлеуметтік қолдау көрсету туралы
