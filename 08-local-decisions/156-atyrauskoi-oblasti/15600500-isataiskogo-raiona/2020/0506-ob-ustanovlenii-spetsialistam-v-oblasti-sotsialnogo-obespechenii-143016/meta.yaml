requisite: Решение Исатайского районного маслихата Атырауской области от 6 мая 2020 года № 303-VI. Зарегистрировано Департаментом юстиции Атырауской области 20 мая 2020 года № 4653
title:
  rus: Об установлении специалистам в области социального обеспечения и культуры, являющимся гражданскими служащими и работающим в сельской местности, за счет бюджетных средств повышенные на двадцать пять процентов должностные оклады и тарифные ставки по сравнению с окладами и ставками гражданских служащих, занимающихся этими видами деятельности в городских условиях
  kaz: Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін әлеуметтік қамсыздандыру және мәдениет саласындағы мамандарға бюджет қаражаты есебінен қызметтің осы түрлерімен қалалық жағдайда айналысатын азаматтық қызметшілердің айлықақыларымен және мөлшерлемелерімен салыстырғанда жиырма бес пайызға жоғарылатылған лауазымдық айлықақылар мен тарифтік мөлшерлемелер белгіленсін
