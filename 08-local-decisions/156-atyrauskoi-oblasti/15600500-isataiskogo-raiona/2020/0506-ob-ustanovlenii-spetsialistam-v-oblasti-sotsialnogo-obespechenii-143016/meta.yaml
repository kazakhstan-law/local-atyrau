  title:
    rus: О внесении изменении в решение Исатайского районного маслихата от 6 мая 2020 года № 303-VI «Об установлении специалистам в области социального обеспечения, образования, культуры, спорта и ветеринарии, являющимся гражданскими служащими и работающим в сельской местности повышенные должностные оклады и тарифные ставки»
    kaz: Исатай аудандық мәслихатының 2020 жылғы 6 мамырдағы № 303-VI «Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария саласындағы мамандарға жоғарылатылған лауазымдық айлықақылар мен тарифтік мөлшерлемелер белгілеу туралы» шешіміне өзгерістер енгізу туралы
