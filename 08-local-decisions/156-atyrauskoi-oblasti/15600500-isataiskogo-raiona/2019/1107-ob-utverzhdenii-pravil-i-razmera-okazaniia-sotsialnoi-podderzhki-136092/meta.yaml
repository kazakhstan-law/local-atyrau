  title:
    rus: О внесении изменений в решение Исатайского районного маслихата от 07 ноября 2019 года № 266-VІ «Об утверждении Правил и размера оказания социальной поддержки по оплате коммунальных услуг и приобретению топлива специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Исатайского района»
    kaz: Исатай аудандық мәслихатының 2019 жылғы 07 қарашадағы № 266-VІ «Исатай ауданының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына коммуналдық көрсетілетін қызметтерге ақы төлеу және отын сатып алу бойынша әлеуметтік қолдау көрсету қағидасы мен мөлшерін бекіту туралы» шешіміне өзгерістер енгізу туралы
