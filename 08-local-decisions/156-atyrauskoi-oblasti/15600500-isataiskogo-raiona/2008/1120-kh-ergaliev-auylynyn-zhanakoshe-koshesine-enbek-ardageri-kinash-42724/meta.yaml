act_code: '42724'
requisite: Атырау облысы Исатай ауданы Қамысқала селолық округі әкімінің 2008 жылғы 20 қарашадағы № 85 шешімі. Атырау облысының Әділет департаменті Исатай ауданының Әділет басқармасында 2008 жылғы 10 желтоқсанда № 4-4-116 тіркелді. Күші жойылды - Атырау облысы Исатай ауданы Қамысқала селолық округі әкімінің 2010 жылғы 27 қазандағы № 31 шешімімен
