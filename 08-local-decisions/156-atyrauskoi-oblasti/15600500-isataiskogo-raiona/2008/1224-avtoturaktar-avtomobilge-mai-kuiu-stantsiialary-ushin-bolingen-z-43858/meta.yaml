requisite: Исатай аудандық мәслихатының 2008 жылғы 24 желтоқсандағы № 87-IV шешімі. Исатай аудандық Әділет басқармасында 2009 жылғы 30 қаңтарда № 4-4-120 тіркелді. Күші жойылды - Атырау облысы Исатай аудандық мәслихатының 2010 жылғы 4 ақпандағы № 169-IV шешімімен
title:
