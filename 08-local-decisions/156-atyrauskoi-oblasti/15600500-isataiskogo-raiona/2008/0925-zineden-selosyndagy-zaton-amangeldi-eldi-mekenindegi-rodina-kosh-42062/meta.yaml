act_code: '42062'
requisite: Атырау облысы Исатай ауданы Забурын селолық округі әкімінің 2008 жылғы 25 қыркүйектегі № 15 шешімі. Атырау облысының Әділет департаменті Исатай ауданының Әділет басқармасында 2008 жылғы 28 қазанда № 4-4-108 тіркелді. Күші жойылды - Атырау облысы Исатай ауданы Забурын селолық округі әкімінің 2010 жылғы 26 қазандағы № 24 шешімімен
