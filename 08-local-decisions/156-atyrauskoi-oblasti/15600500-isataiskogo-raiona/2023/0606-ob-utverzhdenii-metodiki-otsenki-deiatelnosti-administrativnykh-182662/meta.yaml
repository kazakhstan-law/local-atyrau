  title:
    rus: О внесении изменений в решение Исатайского районного маслихата от 6 июня 2023 года № 19-VIII "Об утверждении Методики оценки деятельности административных государственных служащих корпуса "Б" государственного учреждения "Аппарат маслихата Исатайского района"
    kaz: Исатай аудандық мәслихатының 2023 жылғы 6 маусымдағы № 19-VIII "Исатай ауданы мәслихатының аппараты" мемлекеттік мекемесінің "Б" корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы" шешіміне өзгерістер енгізу туралы
