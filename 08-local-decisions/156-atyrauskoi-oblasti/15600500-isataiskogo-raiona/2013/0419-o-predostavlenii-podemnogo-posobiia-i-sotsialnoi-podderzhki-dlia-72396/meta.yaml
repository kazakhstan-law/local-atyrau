requisite: Решение Исатайского районного маслихата Атырауской области от 19 апреля 2013 года № 106-V. Зарегистрировано Департаментом юстиции Атырауской области 6 мая 2013 года за № 2721. Утратило силу - решением Исатайского районного маслихата Атырауской области от 19 марта 2014 года № 184-V
title:
  rus: О предоставлении подъемного пособия и социальной поддержки для приобретения или стройтельства жилья специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии, прибывшим для работы и проживания в сельские населенные пункты
  kaz: Ауылдық елді мекендерге жұмыс істеу және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және ветеринария мамандарына көтерме жәрдемақы және тұрғын үй алу немесе салу үшін әлеуметтік қолдау көрсету туралы
