act_code: '90217'
requisite: Решение Исатайского районного маслихата Атырауской области от 5 мая 2015 года № 256-V. Зарегистрировано Департаментом юстиции Атырауской области 01 июня 2015 года № 3218. Утратило силу решением Исатайского районного маслихата Атырауской области от 14 декабря 2023 года № 52-VIII (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении правил проведения раздельных сходов местного сообщества и определения количества представителей жителей села, улицы, многоквартирного жилого дома для участия в сходе местного сообщества на территории сельских округов Исатайского района
  kaz: Исатай ауданының ауылдық округтерінің аумағында жергілікті қоғамдастықтың бөлек жиындарын өткізудің және жергілікті қоғамдастықтың жиынына қатысу үшін ауыл, көше, көппәтерлі тұрғын үй тұрғындары өкілдерінің санын айқындаудың қағидасын бекіту туралы
