  title:
    rus: О внесении изменений в решение районного маслихата от 5 мая 2015 года № 256-V «Об утверждении правил проведения раздельных сходов местного сообщества и определения количества представителей жителей села, улицы, многоквартирного жилого дома для участия в сходе местного сообщества на территории сельских округов Исатайского района»
    kaz: Аудандық мәслихаттың 2015 жылғы 05 мамырдағы № 256-V «Исатай ауданының ауылдық округтерінің аумағында бөлек жергілікті қоғамдастық жиындарын өткізу және жергілікті қоғамдастық жиынына қатысу үшін ауыл, көше, көппәтерлі тұрғын үй тұрғындары өкілдерінің санын айқындау қағидасын бекіту туралы» шешіміне өзгерістер енгізу туралы
