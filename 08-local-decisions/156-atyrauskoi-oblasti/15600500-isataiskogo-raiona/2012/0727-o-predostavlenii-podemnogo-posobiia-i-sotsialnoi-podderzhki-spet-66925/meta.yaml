requisite: Решение Исатайского районного маслихата Атырауской области № 53-V от 27 июля 2012 года. Зарегистрировано Департаментом юстиции Атырауской области 2 августа 2012 года № 4-4-202. Утратило силу - решением Исатайского районного маслихата Атырауской области от 19 апреля 2012 года № 106-V
title:
  rus: О предоставлении подъемного пособия и социальной поддержки специалистам  здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии, прибывшим для работы и проживания в сельские населенные пункты
  kaz: Ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және ветеринария мамандарына көтерме жәрдемақы және әлеуметтік қолдау көрсету туралы
