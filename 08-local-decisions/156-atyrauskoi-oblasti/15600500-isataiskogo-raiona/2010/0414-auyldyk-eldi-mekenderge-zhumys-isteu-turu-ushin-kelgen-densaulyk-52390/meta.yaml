requisite: Атырау облысы Исатай аудандық мәслихатының 2010 жылғы 14 сәуірдегі № 178-IV шешімі. Исатай аудандық Әділет басқармасында 2010 жылғы 13 мамырда № 4-4-160 тіркелді. Күші жойылды - Атырау облысы Исатай аудандық мәслихатының 2010 жылғы 16 тамыздағы № 274-IV шешімімен
title:
