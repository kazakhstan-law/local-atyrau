act_code: '52389'
requisite: Атырау облысы Исатай аудандық мәслихатының 2010 жылғы 14 сәуірдегі № 183-IV шешімі. Исатай аудандық Әділет басқармасында 2010 жылғы 13 мамырда № 4-4-159 тіркелді. Күші жойылды - Исатай аудандық мәслихатының 2012 жылғы 27 шілдедегі № 54-V шешімімен.
title:
  rus: Ауылдық елді мекендерде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, білім беру, әлеуметтік қорғау, мәдениет және спорт ұйымдарының мамандарына отын сатып алу үшін бір жолғы ақшалай төлемдерді тағайындау қаржыландыру және төлеу туралы
