act_code: '154447'
requisite: Решение Индерского районного маслихата Атырауской области от 30 марта 2021 года № 12-VІI. Зарегистрировано Департаментом юстиции Атырауской области 8 апреля 2021 года № 4914
title:
  rus: О предоставлении социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, поселков, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Индерского района на 2021 год
  kaz: 2021 жылға Индер ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, кенттер, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне әлеуметтік қолдау шараларын ұсыну мөлшерін айқындау туралы
