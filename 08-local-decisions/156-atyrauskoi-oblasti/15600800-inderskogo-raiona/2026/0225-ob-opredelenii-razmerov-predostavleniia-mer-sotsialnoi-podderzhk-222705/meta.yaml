act_code: '222705'
requisite: Решение Индерского районного маслихата Атырауской области от 25 февраля 2026 года № 203-VIII
title:
  rus: Об определении размеров предоставления мер социальной поддержки специалистам в области зравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, поселков, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Индерского района на 2026 год
  kaz: 2026 жылға арналған Индер ауданының ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, кенттер, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне әлеуметтік қолдау шараларын ұсыну мөлшері туралы
