act_code: '89150'
requisite: Решение Индерского районного маслихата Атырауской области от 26 марта 2015 года № 261-V. Зарегистрировано Департаментом юстиции Атырауской области 22 апреля 2015 года № 3188. Утратило силу решением Индерского районного маслихата Атырауской области от 30 ноября 2023 года № 53-VІII (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении правил проведения раздельных сходов местного сообщества и определения количества представителей жителей села, микрорайона, улицы, многоквартирного жилого дома для участия в сходе местного сообщества на территории сельских округов Индерского района
  kaz: Индер ауданының ауылдық округтерінің аумағында жергілікті қоғамдастықтың бөлек жиындарын өткізу және жергілікті қоғамдастық жиынына қатысу үшін ауыл, шағын аудан, көше, көппәтерлі тұрғын үй тұрғындары өкілдерінің санын айқындаудың қағидасын бекіту туралы
