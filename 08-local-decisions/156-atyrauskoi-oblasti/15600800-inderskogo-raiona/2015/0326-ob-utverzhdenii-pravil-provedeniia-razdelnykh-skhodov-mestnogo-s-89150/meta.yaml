  title:
    rus: О внесении изменении в решение районного маслихата от 26 марта 2015 года №261-V «Об утверждении правил проведения раздельных сходов местного сообщества и определения количества представителей жителей села, улицы, многоквартирного жилого дома для участия в сходе местного сообщества на территории населенных  пунктов Индерского района»
    kaz: Аудандық мәслихаттың 2015 жылғы 26 наурыздағы №261-V «Индер ауданының елді мекендерінің аумағында бөлек жергілікті қоғамдастық жиындарын өткізу және жергілікті қоғамдастық жиынына қатысу үшін ауыл, көше, көппәтерлі тұрғын үй тұрғындары өкілдерінің санын айқындау қағидасын бекіту туралы» шешіміне өзгерістер енгізу туралы
