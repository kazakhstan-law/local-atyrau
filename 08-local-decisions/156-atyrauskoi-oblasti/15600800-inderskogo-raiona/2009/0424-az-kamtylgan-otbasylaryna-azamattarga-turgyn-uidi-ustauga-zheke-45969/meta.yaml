requisite: Атырау облысы Индер ауданы мәслихатының 2009 жылғы 24 сәуірдегі № 142-IV шешімі. Атырау облысының Әділет департаменті Индер ауданының Әділет басқармасында 2009 жылғы 21 мамырда № 4-6-79 тіркелді. Күші жойылды - Атырау облысы Индер аудандық мәслихатының 2010 жылғы 14 сәуірдегі № 217-IV шешімімен
