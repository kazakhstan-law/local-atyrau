    kaz: Аудандық мәслихаттың 2014 жылғы 10 маусымдағы № 204-V "Индер ауданының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына отын сатып алу үшін әлеуметтік көмек беру туралы" шешіміне өзгерістер енгізу туралы
