requisite: Решение Индерского районного маслихата Атырауской области от 30 января 2018 года № 177-VI. Зарегистрировано Департаментом юстиции Атырауской области 23 февраля 2018 года № 4066. Утратило силу решением Индерского районного маслихата Атырауской области от 18 сентября 2020 года № 396-VI (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: О повышении ставок единого земельного налога и базовых ставок земельного налога на не используемые в соответствии с земельным законодательством Республики Казахстан земли сельскохозяйственного назначения в Индерском районе
  kaz: Қазақстан Республикасының жер заңнамасына сәйкес Индер ауданында пайдаланылмайтын ауыл шаруашылығы мақсатындағы  жерлерге бірыңғай жер салығының  мөлшерлемелерін және жер салығының базалық мөлшерлемелерін арттыру туралы
