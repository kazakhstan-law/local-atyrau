  title:
    rus: О внесении изменения в решение Индерского районного маслихата от 8 ноября 2019 года № 329-VI «Об утверждении Правил и размера оказания социальной поддержки по оплате коммунальных услуг и приобретению топлива специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Индерского района»
    kaz: Индер аудандық мәслихатының 2019 жылғы 8 қарашадағы № 329-VI «Индер ауданының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына коммуналдық көрсетілетін қызметтерге ақы төлеу және отын сатып алу бойынша әлеуметтік қолдау көрсету қағидасымен мөлшерін бекіту туралы» шешіміне өзгеріс енгізу туралы
