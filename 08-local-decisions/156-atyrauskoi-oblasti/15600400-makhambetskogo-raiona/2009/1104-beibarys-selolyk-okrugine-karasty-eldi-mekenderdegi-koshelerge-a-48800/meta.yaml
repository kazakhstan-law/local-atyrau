requisite: Атырау облысы Махамбет ауданы Бейбарыс селолық округі әкімінің 2009 жылғы 4 қарашадағы № 44 шешімі. Атырау облысы Әділет департаменті Махамбет ауданының Әділет басқармасында 2009 жылғы 25 қарашада № 4-3-130 тіркелді. Күші жойылды - Атырау облысы Махамбет ауданы Бейбарыс селолық округі әкімінің 2010 жылғы 29 қарашадағы № 37 шешімімен
