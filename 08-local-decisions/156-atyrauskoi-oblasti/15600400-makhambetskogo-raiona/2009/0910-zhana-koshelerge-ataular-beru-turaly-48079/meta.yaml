requisite: Атырау облысы Махамбет ауданы Сарытоғай селолық округі әкімінің 2009 жылғы 10 қыркүйектегі № 18 шешімі. Атырау облысы Әділет департаменті Махамбет ауданының Әділет басқармасында 2009 жылғы 7 қазанда № 4-3-124 тіркелді. Күші жойылды - Атырау облысы Махамбет ауданы Сарытоғай селолық округі әкімінің 2010 жылғы 15 қарашадағы № 31 шешімімен
