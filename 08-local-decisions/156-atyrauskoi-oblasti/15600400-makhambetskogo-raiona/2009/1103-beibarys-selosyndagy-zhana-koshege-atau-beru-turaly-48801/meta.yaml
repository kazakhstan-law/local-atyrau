requisite: Атырау облысы Махамбет ауданы Бейбарыс селолық округі әкімінің 2009 жылғы 3 қарашадағы № 43 шешімі. Атырау облысы Әділет департаменті Махамбет ауданының Әділет басқармасында 2009 жылғы 26 қарашада № 4-3-131 тіркелді. Күші жойылды - Атырау облысы Махамбет ауданы Бейбарыс селолық округі әкімінің 2010 жылғы 23 қарашадағы № 36 шешімімен
