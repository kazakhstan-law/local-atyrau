requisite: Атырау облысы Махамбет ауданы Сарайшық селолық округі әкімінің 2009 жылғы 16 қыркүйектегі № 31 шешімі. Атырау облысы Әділет департаменті Махамбет ауданының Әділет басқармасында 2009 жылғы 20 қазанда № 4-3-128 тіркелді. Күші жойылды - Атырау облысы Махамбет ауданы Сарайшық селолық округі әкімінің 2010 жылғы 15 қарашадағы № 43 шешімімен
