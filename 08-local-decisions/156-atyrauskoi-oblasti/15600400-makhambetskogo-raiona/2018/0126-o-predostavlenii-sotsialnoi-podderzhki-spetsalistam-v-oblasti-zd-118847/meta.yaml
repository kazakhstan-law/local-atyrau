act_code: '118847'
requisite: Решение Махамбетского районного маслихата Атырауской области от 26 января 2018 года № 207. Зарегистрировано Департаментом юстиции Атырауской области 15 февраля 2018 года № 4057. Утратило силу решением Махамбетского районного маслихата Атырауской области от 22 января 2019 года № 317 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования).
title:
  rus: О предоставлении социальной поддержки спецалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Махамбетского района на 2018 год
  kaz: 2018 жылға арналған Махамбет ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік қолдау  көрсету туралы
