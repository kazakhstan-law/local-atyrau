act_code: '128239'
requisite: Решение Махамбетского районного маслихата Атырауской области от 28 декабря 2018 года № 302. Зарегистрировано Департаментом юстиции Атырауской области 8 января 2019 года № 4320
title:
  rus: Об утрате силы решение районного маслихата от 21 сентября 2016 года № 60 «О предоставлении социальной помощи на приобретение топлива специалистам государственных организаций социального обеспечения, образования, культуры и спорта проживающим и работающим в сельских населенных пунктах Махамбетского района»
  kaz: Аудандық мәслихаттың 2016 жылғы 21 қыркүйектегі № 60 «Махамбет ауданының ауылдық елді мекендерде тұратын және жұмыс істейтін мемлекеттік әлеуметтік қамсыздандыру, білім беру, мәдениет және спорт ұйымдарының мамандарына отын сатып алу үшін әлеуметтік көмек беру туралы» шешімнің күшін жою туралы
