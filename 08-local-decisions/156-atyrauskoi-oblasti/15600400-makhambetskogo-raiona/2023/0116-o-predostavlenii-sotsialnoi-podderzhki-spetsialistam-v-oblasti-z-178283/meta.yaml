  title:
    rus: О внесении изменении в решение Махамбетского районного маслихата от 16 января № 199 «О предоставлении социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, поселков, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Махамбетского района на 2023 год»
    kaz: Махамбет аудандық мәслихатының 2023 жылғы 16 қаңтардағы № 199 «2023 жылға арналған Махамбет ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, кенттер, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне әлеуметтік қолдау көрсету туралы»шешіміне өзгеріс енгізу туралы
