  title:
    rus: О внесении изменений в решение Махамбетского районного маслихата от 22 декабря 2023 года № 87 «Об утверждении порядка проведения раздельных сходов местного сообщества и определения количества представителей жителей села, микрорайона, улицы, многоквартирного жилого дома для участия в сходе местного сообщества на территории сельских округов Махамбетского района»
    kaz: Аудандық мәслихаттың 2023 жылғы 22 желтоқсандағы № 87 «Махамбет ауданының ауылдық округтерінің аумағында жергілікті қоғамдастықтың бөлек жиындарын өткізу және жергілікті қоғамдастық жиынына қатысу үшін ауыл, шағын аудан, көше, көппәтерлі тұрғын үй тұрғындары өкілдерінің санын айқындаудың тәртібін бекіту туралы» шешіміне өзгерістер енгізу туралы
