act_code: '155114'
requisite: Решение Махамбетского районного маслихата Атырауской области от 16 апреля 2021 года № 37. Зарегистрировано Департаментом юстиции Атырауской области 22 апреля 2021 года № 4934
title:
  rus: О предоставлении социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, поселков, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Махамбетского района на 2021 год
  kaz: 2021 жылға арналған Махамбет ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, кенттер, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне әлеуметтік қолдау көрсету туралы
