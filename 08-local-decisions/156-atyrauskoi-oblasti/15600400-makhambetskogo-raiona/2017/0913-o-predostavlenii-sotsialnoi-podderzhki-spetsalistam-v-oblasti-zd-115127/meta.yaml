requisite: Решение Махамбетского районного маслихата Атырауской области от 13 сентября 2017 года № 165. Зарегистрировано Департаментом юстиции Атырауской области 2 октября 2017 года № 3953. Утратило силу решением Махамбетского районного маслихата Атырауской области от 26 января 2018 года № 207
title:
  rus: О предоставлении социальной поддержки спецалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Махамбетского района на 2017 год
  kaz: 2017 жылға арналған Махамбет ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік қолдау  көрсету туралы
