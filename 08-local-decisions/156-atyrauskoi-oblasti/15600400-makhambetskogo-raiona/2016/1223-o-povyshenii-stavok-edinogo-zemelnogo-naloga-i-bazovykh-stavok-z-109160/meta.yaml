requisite: Решение Махамбетского районного маслихата Атырауской области от 23 декабря 2016 года № 119. Зарегистрировано Департаментом юстиции Атырауской области 17 января 2017 года № 3767. Утратило силу решением Махамбетского районного маслихата Атырауской области от 26 января 2018 года № 208
title:
  rus: О повышении ставок единого земельного налога и базовых ставок земельного налога на не используемые в соответствии с земельным законодательством Республики Казахстан земли сельскохозяйственного назначения в Махамбетском районе
  kaz: Қазақстан Республикасының жер заңнамасына сәйкес Махамбет ауданында пайдаланылмайтын ауыл шаруашылығы мақсатындағы жерлерге  бірыңғай  жер салығының мөлшерлемелерін және жер салығының базалық мөлшерлемелерін жоғарылату туралы
