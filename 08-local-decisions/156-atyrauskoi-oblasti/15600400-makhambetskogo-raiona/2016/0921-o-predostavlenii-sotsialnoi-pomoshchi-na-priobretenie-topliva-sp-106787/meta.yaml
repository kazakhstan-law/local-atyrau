act_code: '106787'
requisite: Решение Махамбетского районного маслихата Атырауской области от 21 сентября 2016 года № 60. Зарегистрировано Департаментом юстиции Атырауской области 10 октября 2016 года № 3638. Утратило силу решением Махамбетского районного маслихата Атырауской области от 28 декабря 2018 года № 302 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: О предоставлении социальной помощи на приобретение топлива специалистам государственных организаций социального обеспечения, образования, культуры и спорта  проживающим и работающим в сельских населенных пунктах Махамбетского района
  kaz: Махамбет ауданының ауылдық елді мекендерде тұратын және жұмыс істейтін мемлекеттік әлеуметтік қамсыздандыру, білім беру,  мәдениет және  спорт ұйымдарының мамандарына отын сатып алу үшін әлеуметтік көмек беру туралы
