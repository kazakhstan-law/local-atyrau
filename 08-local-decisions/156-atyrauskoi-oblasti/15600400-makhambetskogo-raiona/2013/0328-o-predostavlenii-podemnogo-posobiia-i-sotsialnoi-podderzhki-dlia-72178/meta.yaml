act_code: '72178'
requisite: Решение Махамбетского районного маслихата Атырауской области от 28 марта 2013 года № 79. Зарегистрировано Департаментом юстиции Атырауской области 22 апреля 2013 года № 2711. Утратило силу решением Махамбетского районного маслихата Атырауской области от 12 февраля 2014 года № 179
title:
  rus: О предоставлении подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии, прибывшим для работы и проживания в сельские населенные пункты
  kaz: Ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және ветеринария мамандарына көтерме жәрдемақы және тұрғын үй алу немесе салу үшін әлеуметтік қолдау көрсету туралы
