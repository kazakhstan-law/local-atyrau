act_code: '88264'
requisite: Решение Махамбетского районного маслихата Атырауской области от 26 февраля 2015 года № 263. Зарегистрировано Департаментом юстиции Атырауской области 06 апреля 2015 года № 3142. Утратило силу решением Махамбетского районного маслихата Атырауской области от 13 декабря 2023 года № 78 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении правил проведения раздельных сходов местного сообщества и определения количества представителей жителей села, микрорайона, улицы, многоквартирного жилого дома для участия в сходе местного сообщества на территории сельских округов Махамбетского района
  kaz: «Махамбет ауданының ауылдық округтерінің аумағында жергілікті қоғамдастықтың бөлек жиындарын өткізу және жергілікті қоғамдастық жиынына қатысу үшін ауыл, шағын аудан, көше, көппәтерлі тұрғын үй тұрғындары өкілдерінің санын айқындаудың қағидасын бекіту туралы
