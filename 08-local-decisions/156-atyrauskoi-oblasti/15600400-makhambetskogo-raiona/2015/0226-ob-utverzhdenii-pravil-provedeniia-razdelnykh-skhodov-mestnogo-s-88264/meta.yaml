  title:
    rus: О внесении изменений в решение районного маслихата  от 26 февраля 2015 года № 263 «Об утверждении правил проведения раздельных сходов местного сообщества и определения количества представителей жителей села, улицы, многоквартирного жилого дома для участия в сходе местного сообщества на территории сельских округов Махамбетского района»
    kaz: Аудандық мәслихаттың 2015 жылғы 26 ақпандағы № 263 «Махамбет ауданының ауылдық округтерінің аумағында бөлек жергілікті қоғамдастық жиындарын өткізу және жергілікті қоғамдастық жиынына қатысу үшін ауыл, көше, көппәтерлі тұрғын үй тұрғындары өкілдерінің санын айқындау қағидасын бекіту туралы» шешіміне өзгерістер енгізу туралы
