requisite: Решение Махамбетского районного маслихата Атырауской области от 22 сентября 2015 года № 321. Зарегистрировано Департаментом юстиции Атырауской области 20 октября 2015 года № 3318. Утратило силу решением Махамбетского районного маслихата Атырауской области от 21 сентября 2016 года № 60
title:
  rus: О предоставлении социальной помощи на приобретение топлива специалистам государственных организаций социального обеспечения, образования, культуры, спорта и ветеринарии проживающим и работающим в сельских населенных пунктах Махамбетского районама
  kaz: Махамбет ауданының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік әлеуметтік қамсыздандыру,  білім беру,  мәдениет, спорт және ветеринария ұйымдарының мамандарына отын сатып алу үшін әлеуметтік көмек беру туралы
