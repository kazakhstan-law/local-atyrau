requisite: Решение Махамбетского районного маслихата Атырауской области от 22 января 2019 года № 317. Зарегистрировано Департаментом юстиции Атырауской области 29 января 2019 года № 4339
title:
  rus: О предоставлении социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Махамбетского района на 2019 год
  kaz: 2019 жылға арналған Махамбет ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік қолдау көрсету туралы
