  title:
    rus: О внесении изменения в решение районного маслихата от 12 сентября 2019 года № 366 «Об утверждении Правил и размера оказания социальной поддержки по оплате коммунальных услуг и приобретению топлива за счет бюджетных средств специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Махамбетского района»
    kaz: Аудандық мәслихаттың 2019 жылғы 12 қыркүйектегі № 366 «Махамбет ауданының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына бюджет қаражаты есебінен коммуналдық көрсетілетін қызметтерге ақы төлеу және отын сатып алу бойынша әлеуметтік қолдау көрсету қағидасы мен мөлшерін бекіту туралы» шешіміне өзгеріс енгізу туралы
