requisite: Решение Махамбетского районного маслихата Атырауской области от 24 октября 2014 года № 233. Зарегистрировано Департаментом юстиции Атырауской области 6 ноября 2014 года № 3039. Утратило силу решением маслихата Махамбетского района Атырауской области от 22 сентября 2015 года № 321
title:
  rus: О предоставлении социальной помощи на приобретение топлива специалистам государственных организаций социального обеспечения, образования, культуры, спорта и ветеринарии проживающим и работающим в сельских населенных пунктах Махамбетского района
  kaz: Махамбет ауданының ауылдық елді мекендерде тұратын және жұмыс істейтін мемлекеттік әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына отын сатып алу үшін әлеуметтік көмек беру туралы
