requisite: Решение Кызылкогинского районного маслихата Атырауской области № XXXII-5 от 30 сентября 2011 года. Зарегистрировано Департаментом юстиции Атырауской области 31 октября 2011 года № 4-5-152. Утратило силу - решением Кызылкогинского районного маслихата Атырауской области от 7 декабря 2012 № IX-5
title:
  rus: О предоставлении мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры и спорта, прибывшим для работы и проживания в сельские населенные пункты
  kaz: Ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет және спорт мамандарына әлеуметтік қолдау шараларын ұсыну туралы
