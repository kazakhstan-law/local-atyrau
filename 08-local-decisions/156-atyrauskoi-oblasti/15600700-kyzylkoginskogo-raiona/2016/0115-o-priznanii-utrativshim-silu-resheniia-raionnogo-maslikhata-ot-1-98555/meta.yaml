title:
  rus: 'О признании утратившим силу решения районного маслихата от 18 ноября 2015 года № ХХХV-10  «Об утверждении методики ежегодной оценки деятельности административных государственных служащих корпуса «Б» аппарата Кызылкогинского районного маслихата» '
  kaz: 'Аудандық мәслихаттың 2015  жылғы 18 қарашадағы №ХХХV-10 «Қызылқоға аудандық мәслихат аппаратының «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін жыл сайынғы бағалау әдістемесін бекіту туралы» шешімінің күшін жою туралы  '
