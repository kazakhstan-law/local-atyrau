requisite: Решение Кызылкогинского районного маслихата Атырауской области от 26 февраля 2016 года № XXXVIII-3.
title:
  rus: О признании  утратившим  силу  решения районного маслихата от 18 ноября 2015 года № ХХХV-5  «О повышении ставок единого земельного налога и ставок земельного налога на не используемые в соответствии с земельным законодательством Республики Казахстан земли сельскохозяйственного назначения  в Кызылкогинском районе»
  kaz: Аудандық мәслихаттың  2015 жылғы 18 қарашадағы  № ХХХV-5 «Қазақстан Республикасының   жер заңнамасына сәйкес Қызылқоға ауданында пайдаланылмайтын ауыл шаруашылығы мақсатындағы   жерлерге   бірыңғай   жер салығының  мөлшерлемелерін  және жер салығының мөлшерлемелерін жоғарылату туралы» шешімінің күшін жою туралы
