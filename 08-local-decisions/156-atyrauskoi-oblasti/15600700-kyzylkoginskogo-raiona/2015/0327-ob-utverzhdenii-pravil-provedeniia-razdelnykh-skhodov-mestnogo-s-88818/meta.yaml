    kaz: Аудандық мәслихаттың 2015 жылғы 27 наурыздағы №ХХХ-5 «Қызылқоға ауданының ауылдық округтерінің аумағында бөлек жергілікті қоғамдастық жиындарын өткізу және жергілікті қоғамдастық жиынына қатысу үшін ауыл, көше, көппәтерлі тұрғын үй тұрғындары өкілдерінің санын айқындау қағидасын бекіту туралы» шешіміне өзгерістер енгізу туралы
