  title:
    rus: О внесении изменения и дополнений в решение Кызылкогинского районного маслихата от 18 ноября 2015 года № XXXV-3 «Об утверждении правил оказания жилищной помощи малообеспеченным семьям (гражданам), проживающим в Кызылкогинском районе»
    kaz: Қызылқоға аудандық мәслихатының 2015 жылғы 18 қарашадағы № ХХХV-3 «Қызылқоға ауданында тұратын аз қамтылған отбасыларға (азаматтарға) тұрғын үй көмегін көрсетудің қағидасын бекіту туралы» шешіміне өзгеріс пен толықтырулар енгізу туралы
