    kaz: Қызылқоға аудандық мәслихатының 2015 жылғы 18 қарашадағы № ХХХV-3 «Қызылқоға ауданында тұратын аз қамтылған отбасыларға (азаматтарға) тұрғын үй көмегін көрсетудің қағидасын бекіту туралы» шешіміне өзгерістер енгізу туралы
