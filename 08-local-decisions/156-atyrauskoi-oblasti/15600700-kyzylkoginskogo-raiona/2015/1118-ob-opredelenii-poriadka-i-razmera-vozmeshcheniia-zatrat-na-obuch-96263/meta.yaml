  title:
    rus: О внесении изменений в решение Кызылкогинского районного маслихата от 18 ноября 2015 года № XXXV-2 «Об определении порядка и установлении размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа инвалидов по индивидуальному учебному плану»
    kaz: Қызылқоға аудандық мәслихатының 2015 жылғы 18 қарашадағы № ХХХV-2 «Мүгедектер қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсалған шығындарын айқындау тәртібі мен мөлшерін белгілеу туралы» шешіміне өзгерістер енгізу туралы
