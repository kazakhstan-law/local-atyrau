  title:
    rus: О внесении изменений и дополнения в решение Кызылкогинского районного маслихата от 18 ноября 2015 года № ХХХV-2 «Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа детей с инвалидностью по индивидуальному учебному плану в Кызылкогинском районе»
    kaz: Қызылқоға аудандық мәслихатының 2015 жылғы 18 қарашадағы № ХХХV-2 «Қызылқоға ауданында мүгедектігі бар балалар қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсалған шығындарын өндіріп алу тәртібі және мөлшерін айқындау туралы» шешіміне өзгерістер және толықтыру енгізу туралы
