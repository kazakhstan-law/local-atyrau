act_code: '170031'
requisite: Решение Кызылкогинского районного маслихата Атырауской области от 22 июля 2022 года № 19-1. Зарегистрировано в Министерстве юстиции Республики Казахстан 23 июля 2022 года № 28871
title:
  rus: О признании утратившим силу решения Кызылкогинского районного маслихата Атырауской области от 28 сентября 2020 года № LVI-3 «О повышении базовых ставок земельного налога на земли сельскохозяйственного назначения, не используемые в соответствии с земельным законодательством Республики Казахстан в Кызылкогинском районе»
  kaz: Атырау облысы Қызылқоға аудандық мәслихатының 2020 жылғы 28 қыркүйектегі № LVI-3 «Қазақстан Республикасының жер заңнамасына сәйкес Қызылқоға ауданында пайдаланылмайтын ауыл шаруашылығы мақсатындағы жерлерге жер салығының базалық мөлшерлемелерін арттыру туралы» шешімінің күшін жою туралы
