requisite: Атырау облысы Қызылқоға аудандық мәслихатының 2009 жылғы 23 желтоқсандағы № XVI-1 шешімі. Әділет департаменті Қызылқоға ауданының Әділет басқармасында 2010 жылғы 25 қаңтарында № 4-5-120 тіркелді. Күші жойылды - Атырау облысы Қызылқоға аудандық мәслихатының 2013 жылғы 19 сәуірдегі № ХІІІ-4 шешімімен
