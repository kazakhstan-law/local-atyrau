act_code: '37582'
requisite: Атырау облысы Қызылқоға аудандық мәслихатының 2008 жылғы 21 қаңтардағы № ІV-2 шешімі. Атырау облысының Әділет департаменті Қызылқоға ауданының Әділет басқармасында 2008 жылғы 13 ақпанда № 4-5-92 болып тіркелді
