requisite: Атырау облысы Қызылқоға аудандық мәслихатының 2006 жылғы 11 желтоқсандағы № XXIX-6 шешімі. Атырау облысының Әділет департаменті Қызылқоға  ауданының Әділет басқармасында 2006 жылғы 25 желтоқсанда № 4-5-65 болып тіркелді
title:
  rus: Аудандық мәслихаттың 2006 жылғы 17 сәуірдегі мемлекеттік тіркеу 4-5-60 «Қызылқоға ауданы мемлекеттік органдарымен жекеменшік иелерінің жер учаскелерін (пайдалану құқығын) алып қою, сатып алу жөніндегі жұмыстарымен қарым-қатынастарын ұйымдастыру Ережелері туралы» № XXV-6 шешімінің күшін жою туралы
