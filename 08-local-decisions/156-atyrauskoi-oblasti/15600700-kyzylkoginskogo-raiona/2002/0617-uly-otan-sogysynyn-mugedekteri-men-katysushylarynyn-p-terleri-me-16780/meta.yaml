requisite: Атырау облысының ІІ-сайланған Қызылқоға аудандық мәслихатының ХХІV-сессиясының 2003 жылғы 18 маусымдағы № ХХІV-3 шешімі. Атырау облыстық Әділет басқармасында 2003 жылғы 8 шілдеде № 1552 тіркелді. Күші жойылды - Атырау облысы әкімінің 2007 жылғы 13 ақпандағы № ХХХІ-2 шешімімен
