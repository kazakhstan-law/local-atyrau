requisite: Решение Атырауского городского маслихата Атырауской области от 5 июня 2018 года № 224. Зарегистрировано Департаментом юстиции Атырауской области 29 июня 2018 года № 4184. Утратило силу решением Атырауского городского маслихата Атырауской области от 2 декабря 2022 года № 204 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: О повышении ставок единого земельного налога и базовых ставок земельного налога на не используемые в соответствии с земельным законодательством Республики Казахстан земли сельскохозяйственного назначения в городе Атырау
  kaz: Қазақстан Республикасының жер заңнамасына сәйкес Атырау қаласында пайдаланылмайтын ауыл шаруашылығы мақсатындағы жерлерге біріңғай жер салығының мөлшерлемелерін және жер салығының базалық мөлшерлемелерін арттыру туралы
