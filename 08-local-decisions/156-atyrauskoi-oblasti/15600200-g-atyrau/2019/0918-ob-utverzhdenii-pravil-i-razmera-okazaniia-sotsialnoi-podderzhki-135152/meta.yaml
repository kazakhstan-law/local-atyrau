act_code: '135152'
requisite: Решение Атырауского городского маслихата Атырауской области от 18 сентября 2019 года № 412. Зарегистрировано Департаментом юстиции Атырауской области 1 октября 2019 года № 4497
title:
  rus: Об утверждении правил и размера оказания социальной поддержки по оплате коммунальных услуг и приобретению топлива специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии проживающим и работающим в сельских населенных пунктах города Атырау
  kaz: Атырау қаласының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына коммуналдық көрсетілетін қызметтерге ақы төлеу және отын сатып алу бойынша әлеуметтік қолдау көрсету қағидасы мен мөлшерін бекіту туралы
