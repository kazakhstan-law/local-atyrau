requisite: Решение маслихата города Атырау Атырауской области от 26 июня 2019 года № 379. Зарегистрировано Департаментом юстиции Атырауской области 27 июня 2019 года № 4424. Утратило силу решением маслихата города Атырау Атырауской области от 13 июня 2023 года № 38 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении норм образования и накопления коммунальных отходов, а также тарифов на сбор, вывоз и захоронение твердых бытовых отходов по городу Атырау
  kaz: Атырау қаласы бойынша коммуналдық қалдықтардың пайда болу және жинақталу нормаларын, сондай-ақ тұрмыстық қатты қалдықтарды жинауға, әкетуге және көмуге арналған тарифтерді бекіту туралы
