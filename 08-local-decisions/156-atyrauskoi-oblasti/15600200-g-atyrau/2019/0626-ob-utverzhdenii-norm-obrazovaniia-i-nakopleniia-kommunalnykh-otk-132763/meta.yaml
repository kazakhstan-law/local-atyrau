title:
  rus: Об утверждении норм образования и накопления коммунальных отходов, а также тарифов на сбор, вывоз и захоронение твердых бытовых отходов по городу Атырау
  kaz: Атырау қаласы бойынша коммуналдық қалдықтардың пайда болу және жинақталу нормаларын, сондай-ақ тұрмыстық қатты қалдықтарды жинауға, әкетуге және көмуге арналған тарифтерді бекіту туралы
