  title:
    rus: О внесении изменении в решение Маслихата города Атырау от 26 июня 2019 года № 379 «Об утверждении норм образования и накопления коммунальных отходов, а также тарифов на сбор, вывоз и захоронение твердых бытовых отходов по городу Атырау»
    kaz: Атырау қаласы Мәслихатының 2019 жылғы 26 маусымдағы № 379 «Атырау қаласы бойынша коммуналдық қалдықтардың пайда болу және жинақталу нормаларын, сондай-ақ тұрмыстық қатты қалдықтарды жинауға, әкетуге және көмуге арналған тарифтерді бекіту туралы» шешіміне өзгерістер енгізу туралы
