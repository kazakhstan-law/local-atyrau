title:
  rus: О повышении ставок единого земельного налога и базовых ставок земельного налога на не используемые в соответствии с земельным законодательством Республики Казахстан земли сельскохозяйственного назначения в городе Атырау
  kaz: Қазақстан Республикасының жер заңнамасына сәйкес Атырау қаласында пайдаланылмайтын ауыл шаруашылығы мақсатындағы жерлерге бірыңғай жер салығының мөлшерлемелерін және жер  салығының базалық мөлшерлемелерін жоғарылату туралы
