  title:
    rus: О внесении изменении в решение Атырауского городского маслихата от 27 марта 2015 года №264 «Об утверждении правил проведения раздельных сходов местного сообщества и определения количества представителей жителей села, улицы, многоквартирного жилого дома для участия в сходе местного сообщества на территории сельских округов города Атырау»
    kaz: Атырау қалалық мәслихатының 2015 жылғы 27 наурыздағы №264 «Атырау қаласы ауылдық округтерінің аумағында бөлек жергілікті қоғамдастық жиындарын өткізу және жергілікті қоғамдастық жиынына қатысу үшін ауыл,көше, көппәтерлі тұрғын үй тұрғындары өкілдерінің санын айқындау қағидасын бекіту туралы» шешіміне өзгерістер енгізу туралы
