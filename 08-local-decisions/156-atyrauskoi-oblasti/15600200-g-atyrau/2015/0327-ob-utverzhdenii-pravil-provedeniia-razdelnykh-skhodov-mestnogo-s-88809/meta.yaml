requisite: Решение Атырауского городского маслихата Атырауской области от 27 марта 2015 года № 264. Зарегистрировано Департаментом юстиции Атырауской области 20 апреля 2015 года № 3181. Утратило силу решением маслихата города Атырау Атырауской области от 20 декабря 2023 года № 77 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении правил проведения раздельных сходов местного сообщества и определения количества представителей жителей села, улицы, многоквартирного жилого дома для участия в сходе местного сообщества на территории сельских округов города Атырау
  kaz: Атырау қаласы ауылдық округтерінің аумағында бөлек жергілікті қоғамдастық жиындарын өткізу және жергілікті қоғамдастық жиынына қатысу үшін ауыл, көше, көппәтерлі тұрғын үй тұрғындары өкілдерінің санын айқындау қағидасын бекіту туралы
