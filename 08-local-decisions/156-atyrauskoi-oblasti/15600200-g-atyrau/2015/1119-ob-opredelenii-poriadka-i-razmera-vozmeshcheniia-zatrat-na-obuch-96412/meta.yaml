    kaz: Атырау қалалық мәслихатының 2015 жылғы 19 қарашадағы № 307 «Мүгедектер қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын айқындау тәртібі мен мөлшерін белгілеу туралы» шешіміне өзгерістер енгізу туралы
