requisite: Атырау қалалық мәслихатының 2010 жылғы 3 ақпандағы № 175 шешімі. Атырау қалалық Әділет басқармасында 2010 жылғы 15 наурызда № 4-1-110 тіркелді. Күші жойылды - Атырау қалалық мәслихатының 2010 жылғы 8 желтоқсандағы № 231 шешімімен.
