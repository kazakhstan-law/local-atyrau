act_code: '146215'
requisite: Решение Курмангазинского районного маслихата Атырауской области от 25 августа 2020 года № 532-VI. Зарегистрировано Департаментом юстиции Атырауской области 10 сентября 2020 года № 4722
title:
  rus: О признании утратившим силу решение районного маслихата от 20 марта 2018 года № 279-VI «О повышении ставок единого земельного налога и базовых ставок земельного налога на не используемые в соответствии с земельным законодательством Республики Казахстан земли сельскохозяйственного назначения в Курмангазинском районе»
  kaz: Аудандық мәслихаттың 2018 жылғы 20 наурыздағы № 279-VI «Қазақстан Республикасының жер заңнамасына сәйкес Құрманғазы ауданында пайдаланылмайтын ауыл шаруашылығы мақсатындағы жерлерге бірыңғай жер салығының мөлшерлемелерін және жер салығының базалық мөлшерлемелерін арттыру туралы» шешімінің күшін жою туралы
