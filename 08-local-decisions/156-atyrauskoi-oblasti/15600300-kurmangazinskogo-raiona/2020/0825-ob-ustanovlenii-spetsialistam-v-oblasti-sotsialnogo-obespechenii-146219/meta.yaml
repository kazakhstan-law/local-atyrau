requisite: Решение Курмангазинского районного маслихата Атырауской области от 25 августа 2020 года № 533-VI. Зарегистрировано Департаментом юстиции Атырауской области 10 сентября 2020 года № 4723. Утратило силу решением Курмангазинского районного маслихата Атырауской области от 26 декабря 2024 года № 185-VIII (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении специалистам в области социального обеспечения, образования, культуры, спорта и ветеринарии, являющимся гражданскими служащими и работающим в сельской местности повышенные должностные оклады и тарифные ставки
  kaz: Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария саласындағы мамандарға жоғарылатылған лауазымдық айлықақылар мен тарифтік мөлшерлемелер белгілеу туралы
