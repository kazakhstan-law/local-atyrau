act_code: '85982'
requisite: Решение Курмангазинского районного маслихата Атырауской области от 26 декабря 2014 года № 364-V. Зарегистрировано Департаментом юстиции Атырауской области 16 января 2015 года № 3085. Утратило силу решением Курмангазинского районного маслихата Атырауской области от 25 декабря 2023 года № 103-VIII (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении правил проведения раздельных сходов местного сообщества и определения количества представителей жителей села, улицы, многоквартирного жилого дома для участия в сходе местного сообщества на территории сельских округов Курмангазинского района
  kaz: Құрманғазы ауданының ауылдық округтерінің аумағында жергілікті қоғамдастықтың бөлек жиындарын өткізу және жергілікті қоғамдастық жиынына қатысу үшін ауыл, көше, көппәтерлі тұрғын үй тұрғындары өкілдерінің санын айқындау қағидасын бекіту туралы
