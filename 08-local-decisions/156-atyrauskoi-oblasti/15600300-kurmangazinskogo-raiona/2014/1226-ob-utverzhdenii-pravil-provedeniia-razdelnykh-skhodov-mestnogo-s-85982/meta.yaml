  title:
    rus: О внесении изменений в решение районного маслихата от 26 декабря 2014 года № 364-V «Об утверждении правил проведения раздельных сходов местного сообщества и определения количества представителей жителей села, улицы, многоквартирного жилого дома для участия в сходе местного сообщества на территории сельских округов Курмангазинского района»
    kaz: Аудандық мәслихаттың 2014 жылғы 26 желтоқсандағы № 364-V «Құрманғазы ауданының ауылдық округтерінің аумағында бөлек жергілікті қоғамдастық жиындарын өткізу және жергілікті қоғамдастық жиынына қатысу үшін ауыл, көше, көппәтерлі тұрғын үй тұрғындары өкілдерінің санын айқындау қағидасын бекіту туралы» шешіміне өзгерістер енгізу туралы
