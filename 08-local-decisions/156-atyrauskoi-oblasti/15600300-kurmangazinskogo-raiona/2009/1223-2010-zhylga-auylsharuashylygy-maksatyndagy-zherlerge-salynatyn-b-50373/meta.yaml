requisite: Атырау облысы Құрманғазы аудандық мәслихатының 2009 жылғы 23 желтоқсандағы № 234-ХХV шешімі. Атырау облысы Әділет департаменті Құрманғазы ауданының Әділет басқармасында 2010 жылғы 27 қаңтарда № 4-8-179 тіркелді. Күші жойылды - Құрманғазы аудандық мәслихатының 2012 жылғы 8 мамырдағы № 41-V шешімімен
