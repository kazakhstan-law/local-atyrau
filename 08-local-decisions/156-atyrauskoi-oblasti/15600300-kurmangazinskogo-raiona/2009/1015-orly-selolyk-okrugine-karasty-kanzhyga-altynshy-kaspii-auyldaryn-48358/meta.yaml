act_code: '48358'
requisite: Атырау облысы Құрманғазы ауданы Орлы селолық округі әкімінің 2009 жылғы 15 қазандағы № 29 шешімі. Атырау облысы Әділет департаменті Құрманғазы ауданының Әділет басқармасында 2009 жылғы 28 қазанда № 4-8-158 болып тіркелді. Күші жойылды - Атырау облысы Құрманғазы ауданы Орлы селолық округі әкімінің 2010 жылғы 22 қазандағы № 77 шешімімен
