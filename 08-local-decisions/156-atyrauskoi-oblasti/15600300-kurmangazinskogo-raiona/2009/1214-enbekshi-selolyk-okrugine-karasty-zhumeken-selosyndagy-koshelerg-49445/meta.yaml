act_code: '49445'
requisite: Атырау облысы Құрманғазы ауданы Еңбекші селолық округі әкімінің 2009 жылғы 14 желтоқсандағы № 47 шешімі. Атырау облысы Әділет департаменті Құрманғазы ауданының Әділет басқармасында 2009 жылғы 23 желтоқсанда № 4-8-176 болып тіркелді. Күші жойылды - Атырау облысы Құрманғазы ауданы Еңбекші селолық округі әкімінің 2010 жылғы 22 қазандағы № 77 шешімімен
