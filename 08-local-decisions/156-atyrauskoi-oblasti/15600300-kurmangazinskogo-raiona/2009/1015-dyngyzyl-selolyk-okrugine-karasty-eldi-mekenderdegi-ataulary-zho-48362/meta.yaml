act_code: '48362'
requisite: Атырау облысы Құрманғазы ауданы Дыңғызыл селолық округі әкімінің 2009 жылғы 15 қазандағы № 12 шешімі. Атырау облысы Әділет департаменті Құрманғазы ауданының Әділет басқармасында 2009 жылғы 29 қазанда № 4-8-162 болып тіркелді. Күші жойылды - Атырау облысы Құрманғазы ауданы Дыңғызыл селолық округі әкімінің 2010 жылғы 22 қазандағы № 77 шешімімен
