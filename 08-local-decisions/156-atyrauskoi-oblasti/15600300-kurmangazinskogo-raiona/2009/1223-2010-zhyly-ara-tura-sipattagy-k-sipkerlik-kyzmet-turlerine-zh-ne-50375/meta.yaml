requisite: Атырау облысы Құрманғазы аудандық мәслихатының 2009 жылғы 23 желтоқсандағы № 236-ХХV шешімі. Атырау облысы Әділет департаменті Құрманғазы ауданының Әділет басқармасында 2010 жылғы 27 қаңтарда № 4-8-181 тіркелді. Күші жойылды - Құрманғазы аудандық мәслихатының 2013 жылғы 14 наурыздағы № 147-V шешімімен
