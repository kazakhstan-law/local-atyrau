act_code: '48645'
requisite: Атырау облысы Құрманғазы ауданы Ганюшкин селолық округі әкімінің 2009 жылғы 15 қазандағы № 128 шешімі. Атырау облысы Әділет департаменті Құрманғазы ауданының Әділет басқармасында 2009 жылғы 13 қарашада № 4-8-168 болып тіркелді. Күші жойылды - Атырау облысы Құрманғазы ауданы Ганюшкин селолық округі әкімінің 2010 жылғы 22 қазандағы № 77 шешімімен
