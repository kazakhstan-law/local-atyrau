requisite: Атырау облысы Құрманғазы аудандық мәслихатының 2009 жылғы 27 сәуірдегі № 164-XVІІ шешімі. Атырау облысы Әділет департаменті Құрманғазы ауданының Әділет басқармасында 2009 жылғы 20 мамырда № 4-8-147 тіркелді. Күші жойылды - Атырау облысы Құрманғазы аудандық мәслихатының 2009 жылғы 23 желтоқсандағы № 229-XXV шешімімен
