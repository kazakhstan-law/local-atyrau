act_code: '50091'
requisite: Атырау облысы Құрманғазы ауданы Ганюшкино селолық округі әкімінің 2009 жылғы 22 желтоқсандағы № 159 шешімі. Атырау облысы Әділет департаменті Құрманғазы ауданының Әділет басқармасында 2010 жылғы 21 қаңтарда № 4-8-178 тіркелді. Күші жойылды - Ганюшкино селолық округі әкімінің 2010 жылғы 27 сәуірдегі № 26 шешімімен
