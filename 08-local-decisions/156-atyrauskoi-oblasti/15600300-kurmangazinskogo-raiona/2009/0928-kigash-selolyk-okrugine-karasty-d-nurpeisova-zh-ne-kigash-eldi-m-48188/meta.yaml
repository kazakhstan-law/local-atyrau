requisite: Атырау облысы Құрманғазы ауданы Қиғаш селолық округі әкімінің 2009 жылғы 28 қыркүйектегі № 10 қаулысы. Атырау облысы Әділет департаменті Құрманғазы ауданының Әділет басқармасында 2009 жылғы 14 қазанда № 4-8-155 болып тіркелді. Күші жойылды - Атырау облысы Құрманғазы ауданы Қиғаш селолық округі әкімінің 2010 жылғы 22 қазандағы № 77 шешімімен
