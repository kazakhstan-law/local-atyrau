requisite: Атырау облысы Құрманғазы ауданы Еңбекші селолық округі әкімінің 2009 жылғы 9 қазандағы № 36 шешімі. Атырау облысы Әділет департаменті Құрманғазы ауданының Әділет басқармасында 2009 жылғы 28 қазанда № 4-8-156 болып тіркелді. Күші жойылды - Атырау облысы Құрманғазы ауданы Еңбекші селолық округі әкімінің 2010 жылғы 22 қазандағы № 77 шешімімен
