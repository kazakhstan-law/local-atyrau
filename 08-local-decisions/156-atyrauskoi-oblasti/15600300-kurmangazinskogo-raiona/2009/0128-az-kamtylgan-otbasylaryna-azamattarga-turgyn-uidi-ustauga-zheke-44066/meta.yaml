requisite: Атырау облысы Құрманғазы аудандық мәслихатының 2009 жылғы 28 қаңтардағы № 139-XIV шешімі. Атырау облысы Әділет департаменті Құрманғазы ауданының Әділет басқармасында 2009 жылғы 5 ақпанда № 4-8-141 тіркелді. Күші жойылды - Құрманғазы аудандық мәслихатының 2012 жылғы 2 тамыздағы № 69-V шешімімен
