requisite: Атырау облысы Құрманғазы ауданы Ганюшкин селолық округі әкімінің 2009 жылғы 16 қазандағы № 129 шешімі. Атырау облысы Әділет департаменті Құрманғазы ауданының Әділет басқармасында 2009 жылғы 13 қарашада № 4-8-169 болып тіркелді. Күші жойылды - Атырау облысы Құрманғазы ауданы Ганюшкин селолық округі әкімінің 2010 жылғы 22 қазандағы № 77 шешімімен
