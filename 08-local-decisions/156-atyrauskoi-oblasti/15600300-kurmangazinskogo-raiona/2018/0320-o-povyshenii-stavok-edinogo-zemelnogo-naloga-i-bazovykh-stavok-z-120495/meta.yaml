requisite: Решение Курмангазинского районного маслихата Атырауской области от 20 марта 2018 года № 279-VI. Зарегистрировано Департаментом юстиции Атырауской области 4 апреля 2018 года № 4090. Утратило силу решением Курмангазинского районного маслихата Атырауской области от 25 августа 2020 года № 532-VI (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
