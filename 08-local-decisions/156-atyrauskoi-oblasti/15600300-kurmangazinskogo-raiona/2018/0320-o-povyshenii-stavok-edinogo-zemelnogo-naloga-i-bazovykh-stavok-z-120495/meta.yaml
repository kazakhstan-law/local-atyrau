  kaz: Қазақстан Республикасының жер заңнамасына сәйкес Құрманғазы ауданында пайдаланылмайтын ауыл шаруашылығы мақсатындағы жерлерге бірыңғай жер салығының мөлшерлемелерін және жер салығының базалық мөлшерлемелерін арттыру туралы
