act_code: '37800'
requisite: Атырау облысы Құрманғазы аудандық мәслихатының 2007 жылғы 21 желтоқсандағы № 49-III шешімі. Атырау облысының Құрманғазы аудандық Әділет басқармасында 2008 жылғы 17 қаңтарда № 4-8-119 болып тіркелді
title:
  rus: Аудандық мәслихаттың 2006 жылғы 15 желтоқсандағы № 304-XXXIY «2007 жылға жеке кәсіпкер, заңды тұлға, оның бөлімдері, құрылымдары және басқа да жекеленген структуралық бөлімшелер ойын бизнесі саласында көрсеткен қызметіне акциз ставкасының мөлшері туралы» шешімінің күшін жою туралы
