title:
  rus: 'О признании утратившим силу решение районного маслихата от 4 ноября 2015 года №461-V «Об утверждении методики ежегодной оценки деятельности административных государственных служащих корпуса «Б» государственного учреждения «Аппарат Курмангазинского районного маслихата» '
  kaz: 'Аудандық мәслихаттың 2015 жылғы 4 қарашадағы №461-V «Құрманғазы аудандық мәслихаты аппаратының «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін жыл сайынғы бағалаудың әдістемесін бекіту туралы» шешімінің күшін жою туралы '
