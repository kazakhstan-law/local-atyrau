requisite: Решение Курмангазинского районного маслихата Атырауской области от 14 декабря 2016 года № 104-VI. Зарегистрировано Департаментом юстиции Атырауской области 19 января 2017 года № 3769. Утратило силу решением Курмангазинского районного маслихата Атырауской области от 26 января 2018 года № 261-VI
title:
  rus: О повышении ставок единого земельного налога и базовых ставок земельного налога на не используемые в соответствии с земельным законодательством Республики  Казахстан земли сельскохозяйственного назначения в Курмангазинском районе
  kaz: Қазақстан Республикасының жер заңнамасына сәйкес Құрманғазы ауданында пайдаланылмайтын ауыл шаруашылығы мақсатындағы жерлерге бірыңғай жер салығының мөлшерлемелерін және жер салығының базалық мөлшерлемелерін жоғарылату туралы
