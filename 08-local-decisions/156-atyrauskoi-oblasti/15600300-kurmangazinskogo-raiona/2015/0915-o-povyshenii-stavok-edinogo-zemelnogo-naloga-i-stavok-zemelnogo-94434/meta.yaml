    kaz: Аудандық мәслихаттың 2015 жылғы 15 қыркүйектегі №446-V «Қазақстан Республикасының жер заңнамасына сәйкес Құрманғазы ауданында пайдаланылмайтын ауыл шаруашылығы мақсатындағы жерлерге бірыңғай жер салығының мөлшерлемелерін және базалық жер салығының мөлшерлемелерін жоғарылату туралы» шешіміне өзгерістер  енгізу туралы
