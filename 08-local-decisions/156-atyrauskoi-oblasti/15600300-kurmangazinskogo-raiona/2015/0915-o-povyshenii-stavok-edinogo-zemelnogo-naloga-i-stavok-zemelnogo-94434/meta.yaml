title:
  rus: О повышении ставок единого земельного налога и ставок земельного налога на не используемые в соответствии с земельным законодательством Республики Казахстан земли сельскохозяйственного назначения в Курмангазинском районе
  kaz: Қазақстан Республикасының жер заңнамасына сәйкес Құрманғазы ауданында пайдаланылмайтын ауыл шаруашылығы мақсатындағы жерлерге бірыңғай жер салығының мөлшерлемелерін және жер салығының мөлшерлемелерін жоғарылату туралы
